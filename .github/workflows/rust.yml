name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust components
      run: rustup component add clippy rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Build (Debug)
      run: cargo build --locked --verbose
    - name: Build (Release)
      run: cargo build --locked --release --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Run Clippy
      run: cargo clippy --locked --all-targets
    - name: Generate docs
      run: cargo doc --locked --no-deps

    - name: Redirect
      run: echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0; url=win_proxy/index.html"><title>WIN Proxy Documentation</title></head><body><a href="win_proxy/index.html">WIN Proxy Documentation</a></body></html>' > ./target/doc/index.html


    - name: Deploy to gh-pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc/
